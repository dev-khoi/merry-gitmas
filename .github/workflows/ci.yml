name: Check Merry Gitmas
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:visual
      - run: node dist/cli.js demo --fps 2
      - run: npm run test:exports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitmas-preview-and-parity
          path: |
            output/
            test-output/
