name: Generate Merry Gitmas

on:
  push:
    paths-ignore:
      - 'gitmas/**'
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      login:
        description: GitHub account to generate a tree for
        type: string
        default: dev-khoi
      year:
        description: Calendar year (leave empty for the current year)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: merry-gitmas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

