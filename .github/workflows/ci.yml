name: Generate Merry Gitmas

on:
  push:
    paths-ignore:
      - 'gitmas/**'
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      login:
        description: GitHub account to generate a tree for
        type: string
        default: dev-khoi
      year:
        description: Calendar year (leave empty for the current year)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: merry-gitmas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  generate:
    name: Generate and publish tree
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate tree (dev-khoi by default)
        uses: ./
        with:
          login: ${{ inputs.login || 'dev-khoi' }}
          year: ${{ inputs.year || '' }}
          output-dir: gitmas
      - name: Check TypeScript
        run: npm run check
      - name: Downloadable artwork
        uses: actions/upload-artifact@v4
        with:
          name: merry-gitmas
          path: gitmas/
          if-no-files-found: error
      - name: Publish artwork on the default branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          git add -- gitmas/tree.gif gitmas/tree.png gitmas/preview.html gitmas/snapshot.json gitmas/tree-state.json gitmas/FONT-LICENSE.txt
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Gitmas tree'
          git push
