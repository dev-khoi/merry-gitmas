<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Christmas Tree</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      body.idle,
      body.idle #codeBtn {
        cursor: none;
      }

      /* Barely visible toggle for the code panel; lights up on hover. */
      #codeBtn {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 3;
        background: none;
        border: 0;
        padding: 6px 8px;
        font:
          12px Consolas,
          Menlo,
          monospace;
        color: #9aa4c4;
        opacity: 0.16;
        cursor: pointer;
        transition: opacity 0.25s;
      }
      #codeBtn:hover,
      #codeBtn:focus-visible {
        opacity: 0.85;
        outline: none;
      }

      #codePanel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 32vh;
        display: none;
        flex-direction: column;
        overflow: hidden;
        background: #07080d;
        border-top: 1px solid #1b1e2b;
        color: #c9cfe0;
        font-family:
          Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", monospace;
        font-size: clamp(11px, 0.55vh + 0.45vw, 18px);
        line-height: 1.55;
      }
      body.code #codePanel {
        display: flex;
      }
      #codeHead {
        display: flex;
        justify-content: space-between;
        flex: none;
        padding: 0.35em 1em;
        font-size: 0.85em;
        color: #5c6480;
        border-bottom: 1px solid #12141d;
      }
      #codeLines {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        padding-bottom: 2.4em;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .ln {
        display: flex;
        flex: none;
        white-space: pre;
      }
      .ln .no {
        flex: none;
        width: 3.5em;
        padding-right: 1.2em;
        text-align: right;
        color: #3a4058;
      }
      .ln.cur {
        background: linear-gradient(
          90deg,
          rgba(190, 30, 60, 0.3),
          rgba(190, 30, 60, 0.05)
        );
      }
      .ln.cur .no {
        color: #c9cfe0;
      }
      .caret {
        display: inline-block;
        width: 0.55em;
        height: 1.1em;
        background: #ff4d6d;
        vertical-align: text-bottom;
      }
      .tk-c {
        color: #4d556e;
        font-style: italic;
      }
      .tk-s {
        color: #9ece6a;
      }
      .tk-n {
        color: #ff9e64;
      }
      .tk-k {
        color: #f7768e;
      }
      .tk-f {
        color: #7aa2f7;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <button
      id="codeBtn"
      type="button"
      title="Show the code (C)"
      aria-label="Toggle code panel">
      &lt;/&gt;
    </button>
    <div id="codePanel" aria-hidden="true">
      <div id="codeHead"><span>js tree.js</span><span>running</span></div>
      <div id="codeLines"></div>
    </div>
    <script>
      "use strict";

      /* ASCII Christmas Tree
       *
       * A 3D point cloud (needles, trunk, garland, balls, lights, gifts, star) is
       * rotated, projected onto a character grid with a per-cell z-buffer, and each
       * winning point is drawn as one coloured glyph. Glyphs are blitted straight
       * into an ImageData buffer; light glows are added on top with additive
       * blending.
       *
       * URL options:  ?hud=1  ?code=1  ?fps=30  ?loop=600  ?spin=20  ?t=12 (freeze)
        *               ?msg=...  ?from=...  ?gifts=a,b,c  ?santa=0  ?fireworks=0
       * Keys:         H = HUD, C = code panel, F = fullscreen, R = rebuild the tree
       */

      const SOURCE = document.currentScript.textContent; // typed out by the code panel

      // ---------------------------------------------------------------- options
      const TAU = Math.PI * 2;
      const query = new URLSearchParams(location.search);
      const numParam = (key, fallback) => {
        const v = parseFloat(query.get(key));
        return Number.isFinite(v) ? v : fallback;
      };
      const OPT = {
        hud: query.get("hud") === "1", // show the small status overlay
        fps: numParam("fps", 0), // frame cap, 0 = display refresh rate
        loop: numParam("loop", 0), // rebuild every N seconds, 0 = never
        spin: Math.max(1, numParam("spin", 20)), // seconds per full revolution
        freeze: query.has("t") ? numParam("t", 0) : null, // render one fixed time
      };

      // ---------------------------------------------------------------- personalise
      // Edit these, or override them from the URL:
      //   ?msg=Happy+Holidays  ?from=Name  ?gifts=Ann,Bob  ?santa=0  ?fireworks=0
      const CONFIG = {
        message: "", // optional greeting
        from: "", // signature under the banner
        gifts: ["Mom", "Dad", "Ana", "Leo", "Mia"], // one name tag per gift
        santa: false,
        fireworks: false,
      };
      if (query.has("msg")) CONFIG.message = query.get("msg");
      if (query.has("from")) CONFIG.from = query.get("from");
      if (query.has("gifts")) CONFIG.gifts = query.get("gifts").split(",");
      if (query.get("santa") === "0") CONFIG.santa = false;
      if (query.get("fireworks") === "0") CONFIG.fireworks = false;

      // ---------------------------------------------------------------- helpers
      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const smoothstep = (a, b, v) => {
        const x = clamp01((v - a) / (b - a));
        return x * x * (3 - 2 * x);
      };

      function makeRng(seed) {
        let a = seed >>> 0;
        let spare = null;
        const u = () => {
          // mulberry32, uniform in [0, 1)
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const n = () => {
          // standard normal (Box-Muller)
          if (spare !== null) {
            const s = spare;
            spare = null;
            return s;
          }
          let r;
          do {
            r = u();
          } while (r < 1e-12);
          const m = Math.sqrt(-2 * Math.log(r));
          const ang = TAU * u();
          spare = m * Math.sin(ang);
          return m * Math.cos(ang);
        };
        return { u, n, range: (lo, hi) => lo + (hi - lo) * u() };
      }

      // Evenly distributed points on a unit sphere (Fibonacci lattice).
      function fibSphere(count) {
        const out = new Float32Array(count * 3);
        const golden = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < count; i++) {
          const y = 1 - (2 * (i + 0.5)) / count;
          const r = Math.sqrt(1 - y * y);
          const th = golden * i;
          out[i * 3] = r * Math.cos(th);
          out[i * 3 + 1] = y;
          out[i * 3 + 2] = r * Math.sin(th);
        }
        return out;
      }

      // ---------------------------------------------------------------- scene
      const NEEDLE = 0,
        TRUNK = 1,
        BALL = 2,
        LIGHT = 3,
        GARLAND = 4,
        GIFT = 5,
        RIBBON = 6,
        SNOWCAP = 7,
        STAR = 8,
        GROUND = 9,
        FLAKE = 10;

      // Character ramps per kind, from sparse to dense.
      const RAMPS = [];
      RAMPS[NEEDLE] = ".,:;!^*+xvwXVW#";
      RAMPS[TRUNK] = ":|I#";
      RAMPS[BALL] = "oO0@";
      RAMPS[LIGHT] = "*";
      RAMPS[GARLAND] = "-~=%";
      RAMPS[GIFT] = "+H#M@";
      RAMPS[RIBBON] = "=#";
      RAMPS[SNOWCAP] = "*#";
      RAMPS[STAR] = "*#@";
      RAMPS[GROUND] = ".--==";
      RAMPS[FLAKE] = ".'*";

      // Output colour gain per kind (glyphs cover little of a cell, so boost).
      const GAIN = [];
      GAIN[NEEDLE] = 1.7;
      GAIN[TRUNK] = 1.2;
      GAIN[BALL] = 1.15;
      GAIN[LIGHT] = 1;
      GAIN[GARLAND] = 1.1;
      GAIN[GIFT] = 1.15;
      GAIN[RIBBON] = 1.15;
      GAIN[SNOWCAP] = 1;
      GAIN[STAR] = 1;

      const Y0 = 0.42,
        Y1 = 2.55; // foliage spans y in [Y0, Y1]
      const STAR_Y = Y1 + 0.16;
      const STAR_R = 0.2;
      const GROUND_R = 2.3;

      // Foliage radius at height y.
      function envelope(y) {
        const f = clamp01((y - Y0) / (Y1 - Y0));
        return 0.03 + 0.84 * Math.pow(1 - f, 1.08);
      }

      // Timeline (seconds since build start).
      const T_GARLAND = 6.2,
        T_BALLS = 7.6,
        T_LIGHTS = 8.6,
        T_STAR = 9.7,
        T_GIFTS = 10.5,
        T_MESSAGE = 13.4;

      const LIGHT_COLORS = [
        [1.0, 0.86, 0.55], // warm white
        [1.0, 0.7, 0.2], // amber
        [1.0, 0.28, 0.22], // red
        [0.4, 0.62, 1.0], // blue
        [0.45, 1.0, 0.55], // green
      ];

      function buildScene() {
        const rng = makeRng(7);
        const P = [],
          N = [],
          C = [],
          K = [],
          T = [],
          PH = [],
          SH = [],
          O = [];
        let obj = 0; // object id: outlines are traced per object
        const add = (
          x,
          y,
          z,
          nx,
          ny,
          nz,
          r,
          g,
          b,
          kind,
          t0,
          ph = 0,
          sh = 0,
        ) => {
          const len = Math.hypot(nx, ny, nz) || 1;
          P.push(x, y, z);
          N.push(nx / len, ny / len, nz / len);
          C.push(r, g, b);
          K.push(kind);
          T.push(t0);
          PH.push(ph);
          SH.push(sh);
          O.push(obj);
          return K.length - 1;
        };

        // --- needles: whorls of drooping branches, dense at the tips
        obj = 1;
        const trunc = (v, lim) => (v < -lim ? -lim : v > lim ? lim : v); // no stray outliers
        const TIERS = 24;
        const yLo = Y0 + 0.02,
          yHi = Y1 - 0.04;
        for (let i = 0; i < TIERS; i++) {
          const y = yLo + ((yHi - yLo) * i) / (TIERS - 1);
          const f = (y - Y0) / (Y1 - Y0);
          const R = envelope(y);
          const branches = Math.floor(7 + 11 * (1 - f));
          for (let b = 0; b < branches; b++) {
            const a = (TAU * b) / branches + i * 0.618 * TAU + rng.n() * 0.12;
            const L = R * rng.range(0.82, 1.06);
            const count = Math.floor(130 + 700 * L);
            const dx = Math.cos(a),
              dz = Math.sin(a);
            const spreadScale = 0.25 + 0.75 * Math.min(1, L / 0.6);
            for (let j = 0; j < count; j++) {
              const s = Math.pow(rng.u(), 0.65); // 0 = trunk, 1 = tip
              const rad = s * L;
              const spread =
                (0.035 + 0.11 * s) * trunc(rng.n(), 1.5) * spreadScale;
              const yy =
                y + 0.07 * rad - 0.22 * rad * rad + 0.025 * trunc(rng.n(), 1.5);
              const px = dx * rad - dz * spread;
              const pz = dz * rad + dx * spread;
              const nx = dx * 0.75 + rng.n() * 0.25;
              const ny = 0.55 + rng.n() * 0.25;
              const nz = dz * 0.75 + rng.n() * 0.25;
              const ao = 0.35 + 0.65 * Math.pow(s, 1.3); // darker near the trunk
              const tone = ao * rng.range(0.75, 1.1);
              const tip = s * s * 0.35; // lighter green at tips
              const t0 = 1.3 + 5.0 * f + 0.45 * s; // grows bottom-up, inside-out
              if (s > 0.45 && rng.u() < 0.085 * s && ny > 0.3) {
                add(px, yy + 0.01, pz, 0, 1, 0, 0.92, 0.95, 1.0, SNOWCAP, t0);
              } else {
                add(
                  px,
                  yy,
                  pz,
                  nx,
                  ny,
                  nz,
                  (0.07 + 0.3 * tip) * tone,
                  (0.3 + 0.42 * tip) * tone,
                  (0.13 + 0.16 * tip) * tone,
                  NEEDLE,
                  t0,
                );
              }
            }
          }
        }

        // --- trunk: a cylinder with bark stripes
        obj = 2;
        for (let i = 0; i < 50; i++) {
          const h = (0.62 * i) / 49;
          for (let j = 0; j < 40; j++) {
            const a = (TAU * j) / 40;
            const bark = 0.75 + 0.25 * Math.sin(h * 90 + a * 3);
            add(
              0.085 * Math.cos(a),
              h,
              0.085 * Math.sin(a),
              Math.cos(a),
              0,
              Math.sin(a),
              0.42 * bark,
              0.26 * bark,
              0.14 * bark,
              TRUNK,
              0.9 + h,
            );
          }
        }

        // --- tinsel garland: a drooping gold spiral, in swags between branches
        obj = 3;
        const TURNS = 3.6;
        for (let k = 0; k < 5; k++) {
          const offR = rng.n() * 0.012,
            offY = rng.n() * 0.012;
          for (let j = 0; j < 2600; j++) {
            const u = j / 2599;
            const yg = Y0 + 0.15 + (Y1 - Y0 - 0.45) * u;
            const ag = TAU * TURNS * u + 0.9;
            const swag = -0.06 * Math.abs(Math.sin(ag * 2.5));
            const rg = envelope(yg) + 0.03 + offR + rng.n() * 0.006;
            const tone = rng.range(0.7, 1.1);
            add(
              rg * Math.cos(ag),
              yg + swag + offY + rng.n() * 0.006,
              rg * Math.sin(ag),
              Math.cos(ag),
              0.3,
              Math.sin(ag),
              1.0 * tone,
              0.78 * tone,
              0.25 * tone,
              GARLAND,
              T_GARLAND + 2.2 * u,
              rng.u() * TAU,
            );
          }
        }

        // --- balls: shaded spheres hanging near the branch tips
        const sphere = fibSphere(700);
        const ballColors = [
          [0.85, 0.1, 0.14],
          [0.95, 0.72, 0.18],
          [0.85, 0.1, 0.14],
          [0.8, 0.84, 0.92],
        ];
        const BALLS = 26;
        for (let i = 0; i < BALLS; i++) {
          const u = (i + rng.range(0.2, 0.8)) / BALLS;
          const y = Y0 + 0.12 + (Y1 - Y0 - 0.5) * u;
          const a = i * 2.39996 + rng.n() * 0.2;
          const r = envelope(y) * 0.95;
          const cx = r * Math.cos(a),
            cz = r * Math.sin(a);
          const cy = y - 0.22 * r * r + 0.07 * r - 0.05;
          const rad = rng.range(0.05, 0.07) * (0.8 + 0.4 * (1 - u));
          const col = ballColors[i % ballColors.length];
          const t0 = T_BALLS + rng.u() * 1.4;
          obj = 10 + i;
          for (let j = 0; j < sphere.length; j += 3) {
            const sx = sphere[j],
              sy = sphere[j + 1],
              sz = sphere[j + 2];
            add(
              cx + rad * sx,
              cy + rad * sy,
              cz + rad * sz,
              sx,
              sy,
              sz,
              col[0],
              col[1],
              col[2],
              BALL,
              t0,
              0,
              1,
            );
          }
        }

        // --- fairy lights: single emissive points on a second spiral
        obj = 4;
        const lights = [];
        const LIGHTS = 170;
        for (let i = 0; i < LIGHTS; i++) {
          const u = (i + 0.5) / LIGHTS;
          const y = Y0 + 0.05 + (Y1 - Y0 - 0.15) * u + rng.n() * 0.015;
          const a = TAU * 6.5 * u + rng.n() * 0.5;
          const r = envelope(y) * rng.range(0.96, 1.08);
          const pick = rng.u();
          const ci =
            pick < 0.5
              ? 0
              : pick < 0.65
                ? 1
                : pick < 0.8
                  ? 2
                  : pick < 0.9
                    ? 3
                    : 4;
          const col = LIGHT_COLORS[ci];
          const index = add(
            r * Math.cos(a),
            y - 0.2 * r * r + 0.06 * r,
            r * Math.sin(a),
            Math.cos(a),
            0.2,
            Math.sin(a),
            col[0],
            col[1],
            col[2],
            LIGHT,
            T_LIGHTS + rng.u() * 1.5,
            rng.u() * TAU,
            rng.u(),
          );
          lights.push({ index, color: ci });
        }

        // --- star: a flat five-pointed star that always faces the viewer
        obj = 5;
        const starVerts = [];
        for (let k = 0; k < 10; k++) {
          const a = Math.PI / 2 + (k * Math.PI) / 5;
          const r = k % 2 === 0 ? STAR_R : STAR_R * 0.42;
          starVerts.push([r * Math.cos(a), r * Math.sin(a)]);
        }
        for (let k = 0; k < 10; k++) {
          const v1 = starVerts[k],
            v2 = starVerts[(k + 1) % 10];
          for (let j = 0; j < 320; j++) {
            let a = rng.u(),
              b = rng.u();
            if (a + b > 1) {
              a = 1 - a;
              b = 1 - b;
            }
            const sx = a * v1[0] + b * v2[0];
            const sy = a * v1[1] + b * v2[1];
            const core = 1 - (0.3 * Math.hypot(sx, sy)) / STAR_R; // brighter centre
            add(
              sx,
              STAR_Y + sy,
              0.15,
              0,
              0,
              1,
              1.0 * core,
              0.88 * core,
              0.36 * core,
              STAR,
              T_STAR,
            );
          }
        }

        // --- gifts: boxes with ribbons and a bow
        const gifts = [
          {
            ang: 0.5,
            dist: 1.0,
            w: 0.34,
            h: 0.26,
            d: 0.3,
            col: [0.78, 0.08, 0.12],
            rib: [1.0, 0.85, 0.4],
          },
          {
            ang: 1.9,
            dist: 1.04,
            w: 0.26,
            h: 0.2,
            d: 0.26,
            col: [0.12, 0.22, 0.75],
            rib: [0.85, 0.9, 1.0],
          },
          {
            ang: 3.1,
            dist: 0.98,
            w: 0.3,
            h: 0.34,
            d: 0.28,
            col: [0.85, 0.6, 0.12],
            rib: [0.8, 0.08, 0.12],
          },
          {
            ang: 4.2,
            dist: 1.05,
            w: 0.24,
            h: 0.18,
            d: 0.24,
            col: [0.9, 0.9, 0.92],
            rib: [0.8, 0.08, 0.12],
          },
          {
            ang: 5.3,
            dist: 1.0,
            w: 0.32,
            h: 0.24,
            d: 0.3,
            col: [0.5, 0.15, 0.6],
            rib: [1.0, 0.85, 0.4],
          },
        ];
        const bow = fibSphere(400);
        const DENSITY = 36000; // points per unit area (dense: clean edges)
        const RIB = 0.035; // ribbon half-width
        gifts.forEach((gift, gi) => {
          const { w, h, d, col, rib } = gift;
          const yaw = gift.ang + rng.range(-0.5, 0.5);
          const cy = Math.cos(yaw),
            sy = Math.sin(yaw);
          const ox = gift.dist * Math.cos(gift.ang),
            oz = gift.dist * Math.sin(gift.ang);
          const tBase = T_GIFTS + gi * 0.45;
          obj = 100 + gi;
          gift.x = ox;
          gift.z = oz;
          gift.t0 = tBase; // used by the name tags
          const put = (lx, ly, lz, nx, ny, nz, isRibbon) => {
            const c = isRibbon ? rib : col;
            const tone = rng.range(0.88, 1.0);
            add(
              ox + lx * cy - lz * sy,
              ly,
              oz + lx * sy + lz * cy,
              nx * cy - nz * sy,
              ny,
              nx * sy + nz * cy,
              c[0] * tone,
              c[1] * tone,
              c[2] * tone,
              isRibbon ? RIBBON : GIFT,
              tBase + (ly / h) * 0.35,
              0,
              0,
            );
          };
          for (let j = 0, n = Math.floor(w * d * DENSITY); j < n; j++) {
            // top
            const lx = rng.range(-w / 2, w / 2),
              lz = rng.range(-d / 2, d / 2);
            put(lx, h, lz, 0, 1, 0, Math.abs(lx) < RIB || Math.abs(lz) < RIB);
          }
          for (const side of [-1, 1]) {
            for (let j = 0, n = Math.floor(d * h * DENSITY); j < n; j++) {
              // x faces
              const lz = rng.range(-d / 2, d / 2);
              put(
                (side * w) / 2,
                rng.range(0, h),
                lz,
                side,
                0,
                0,
                Math.abs(lz) < RIB,
              );
            }
            for (let j = 0, n = Math.floor(w * h * DENSITY); j < n; j++) {
              // z faces
              const lx = rng.range(-w / 2, w / 2);
              put(
                lx,
                rng.range(0, h),
                (side * d) / 2,
                0,
                0,
                side,
                Math.abs(lx) < RIB,
              );
            }
          }
          for (let j = 0; j < bow.length; j += 3) {
            // bow
            add(
              ox + 0.05 * bow[j],
              h + 0.02 + 0.03 * bow[j + 1],
              oz + 0.05 * bow[j + 2],
              bow[j],
              bow[j + 1],
              bow[j + 2],
              rib[0],
              rib[1],
              rib[2],
              RIBBON,
              tBase + 0.4,
              0,
              0,
            );
          }
        });

        return {
          count: K.length,
          P: new Float32Array(P),
          N: new Float32Array(N),
          C: new Float32Array(C),
          K: new Uint8Array(K),
          T: new Float32Array(T),
          PH: new Float32Array(PH),
          SH: new Float32Array(SH),
          O: new Uint16Array(O),
          lights,
          gifts,
        };
      }

      // ---------------------------------------------------------------- renderer
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d", { alpha: false });
      const scene = buildScene();

      // Camera: orbiting is done by rotating the tree; the camera only pitches down.
      const CAM_DIST = 8;
      const PITCH = (12 * Math.PI) / 180;
      const SIN_P = Math.sin(PITCH),
        COS_P = Math.cos(PITCH);
      const LOOK_Y = 1.45; // world height at the screen anchor

      // Light direction in view space, and the half vector for ball highlights.
      const LX = -0.448,
        LY = 0.647,
        LZ = 0.617;
      const HX = -0.249,
        HY = 0.36,
        HZ = 0.899;

      const BLACK = 0xff000000;

      // Outline glyphs. Each cell tracks which of its 2x2 quadrants are covered
      // (bit 0 = top-left, 1 = top-right, 2 = bottom-left, 3 = bottom-right). On a
      // silhouette, a partly covered cell gets the character whose ink sits in the
      // covered part, which traces contours at twice the grid resolution.
      const SHAPES = [
        null,
        "`",
        "'",
        '"',
        ",",
        "[",
        "/",
        "F",
        ".",
        "\\",
        "]",
        "7",
        "m",
        "L",
        "J",
        null,
      ];
      const EDGE_KIND = [],
        SOLID_KIND = [];
      for (const k of [NEEDLE, SNOWCAP, TRUNK, BALL, GIFT, RIBBON, STAR])
        EDGE_KIND[k] = true;
      for (const k of [BALL, GIFT, RIBBON, STAR]) SOLID_KIND[k] = true;
      const ptCell = new Int32Array(scene.count); // cell each point landed in, or -1
      const ptSub = new Uint8Array(scene.count); // quadrant inside that cell

      let dpr = 1,
        widthPx = 0,
        heightPx = 0;
      let scale = 1,
        centerX = 0,
        centerY = 0; // pixels per world unit, anchor
      let cellW = 6,
        cellH = 10,
        cols = 0,
        rows = 0,
        gridX = 0,
        gridY = 0;
      let cellZ, cellIdx, cellMask, image, pixels;
      let groundX, groundZ, groundDepth, groundR;
      let ramps = []; // ramps[kind] = [{off, alpha}, ...]
      let shapeGlyphs = []; // shapeGlyphs[mask] = {off, alpha}
      let getGlyph = null; // getGlyph(ch) -> {off, alpha}, any character
      let glowSprites = [],
        starSprite = null;
      let flakes = null;

      function makeGlow(color, radius) {
        const size = Math.max(4, Math.ceil(radius * 2));
        const sprite = document.createElement("canvas");
        sprite.width = sprite.height = size;
        const g = sprite.getContext("2d");
        const [r, gr, b] = color.map((v) => Math.round(v * 255));
        const grad = g.createRadialGradient(
          size / 2,
          size / 2,
          0,
          size / 2,
          size / 2,
          size / 2,
        );
        grad.addColorStop(0, `rgba(${r},${gr},${b},0.55)`);
        grad.addColorStop(0.35, `rgba(${r},${gr},${b},0.16)`);
        grad.addColorStop(1, `rgba(${r},${gr},${b},0)`);
        g.fillStyle = grad;
        g.fillRect(0, 0, size, size);
        return sprite;
      }

      // Rasterise every glyph once into a sparse list of (pixel offset, alpha).
      function buildGlyphs() {
        const glyphCanvas = document.createElement("canvas");
        glyphCanvas.width = cellW;
        glyphCanvas.height = cellH;
        const g = glyphCanvas.getContext("2d", { willReadFrequently: true });
        g.font = `bold ${Math.round(cellH * 0.92)}px Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", monospace`;
        g.textAlign = "center";
        g.textBaseline = "middle";
        const cache = new Map();
        const glyph = (ch) => {
          if (cache.has(ch)) return cache.get(ch);
          g.fillStyle = "#000";
          g.fillRect(0, 0, cellW, cellH);
          g.fillStyle = "#fff";
          g.fillText(ch, cellW / 2, cellH / 2 + cellH * 0.04);
          const data = g.getImageData(0, 0, cellW, cellH).data;
          const off = [],
            alpha = [];
          for (let y = 0; y < cellH; y++) {
            for (let x = 0; x < cellW; x++) {
              const a = data[(y * cellW + x) * 4];
              if (a > 24) {
                off.push(y * widthPx + x);
                alpha.push(a);
              }
            }
          }
          const entry = {
            off: new Int32Array(off),
            alpha: new Uint8Array(alpha),
          };
          cache.set(ch, entry);
          return entry;
        };
        ramps = RAMPS.map((ramp) => Array.from(ramp, glyph));
        shapeGlyphs = SHAPES.map((ch) => (ch ? glyph(ch) : null));
        getGlyph = glyph;
      }

      // The ground is ray-cast once per cell: where does this cell hit the plane y=0?
      function buildGround() {
        const n = cols * rows;
        groundX = new Float32Array(n);
        groundZ = new Float32Array(n);
        groundR = new Float32Array(n);
        groundDepth = new Float32Array(n).fill(NaN);
        for (let row = 0; row < rows; row++) {
          const Y = (centerY - (gridY + (row + 0.5) * cellH)) / scale;
          const den = CAM_DIST * SIN_P - Y * COS_P;
          if (den <= 1e-6) continue;
          const lam = (LOOK_Y + CAM_DIST * SIN_P) / den;
          const zv = CAM_DIST * (1 - lam);
          const zw = -lam * Y * SIN_P + zv * COS_P;
          for (let col = 0; col < cols; col++) {
            const X = (gridX + (col + 0.5) * cellW - centerX) / scale;
            const xw = lam * X;
            const r = Math.hypot(xw, zw);
            if (r >= GROUND_R) continue;
            const c = row * cols + col;
            groundX[c] = xw;
            groundZ[c] = zw;
            groundR[c] = r;
            groundDepth[c] = zv;
          }
        }
      }

      function buildFlakes() {
        const rng = makeRng(99);
        const halfW = (widthPx / 2 / scale) * 1.45;
        const top = (centerY / scale) * 1.45;
        const bottom = -((heightPx - centerY) / scale) * 1.45;
        const count = Math.round(
          Math.min(3000, Math.max(380, 2 * halfW * (top - bottom) * 34)),
        );
        flakes = {
          count,
          halfW,
          top,
          bottom,
          x: new Float32Array(count),
          y: new Float32Array(count),
          z: new Float32Array(count),
          speed: new Float32Array(count),
          phase: new Float32Array(count),
          bright: new Float32Array(count),
        };
        for (let i = 0; i < count; i++) {
          flakes.x[i] = rng.range(-halfW, halfW);
          flakes.y[i] = rng.range(bottom, top);
          // Small distant flakes and brighter, faster foreground flakes give
          // the snowfall depth instead of a uniform curtain of white pixels.
          flakes.z[i] = rng.range(-3.8, 3.2);
          flakes.speed[i] = rng.range(0.18, 0.4) + Math.max(0, flakes.z[i]) * 0.055;
          flakes.phase[i] = rng.u() * TAU;
          flakes.bright[i] = rng.range(0.38, 0.85) + Math.max(0, flakes.z[i]) * 0.045;
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        widthPx = Math.max(64, Math.floor(window.innerWidth * dpr));
        const viewH =
          window.innerHeight - (codeState.open ? codePanel.offsetHeight : 0);
        heightPx = Math.max(64, Math.floor(viewH * dpr));
        canvas.style.height = `${viewH}px`;
        canvas.width = widthPx;
        canvas.height = heightPx;

        // Fit the tree (plus gifts) into the window, whichever dimension is tighter.
        scale = Math.min((widthPx * 0.94) / 2.5, (heightPx * 0.70) / 3.35);
        centerX = widthPx / 2;
        // Keep a calm flight corridor above the star in both orientations.
        centerY = heightPx * (heightPx >= widthPx ? 0.62 : 0.54);

        // The grid density follows the scale, so the tree always has the same
        // number of characters regardless of screen size.
        cellH = Math.max(8, Math.round(scale / 30));
        cellW = Math.max(5, Math.round(cellH * 0.6));
        cols = Math.floor(widthPx / cellW);
        rows = Math.floor(heightPx / cellH);
        gridX = (widthPx - cols * cellW) >> 1;
        gridY = (heightPx - rows * cellH) >> 1;

        cellZ = new Float32Array(cols * rows);
        cellIdx = new Int32Array(cols * rows);
        cellMask = new Uint8Array(cols * rows);
        image = ctx.createImageData(widthPx, heightPx);
        pixels = new Uint32Array(image.data.buffer);

        buildGlyphs();
        buildGround();
        buildFlakes();
        buildOverlay();
        glowSprites = LIGHT_COLORS.map((c) => makeGlow(c, cellH * 2.8));
        starSprite = makeGlow([1.0, 0.82, 0.35], scale * 0.5);
        fwSprites = FW_COLORS.map((c) => makeGlow(c, scale * 0.6));
        fwGlyphs = Array.from(FW_RAMP, getGlyph);
      }

      // ---------------------------------------------------------------- overlay text
      // Optional greeting, signature and gift tags are written straight into grid
      // cells after the 3D pass, so they are made of the same characters as the tree.

      // 5x7 pixel font for the banner (rows top to bottom).
      const FONT = {
        A: "01110 10001 10001 11111 10001 10001 10001",
        B: "11110 10001 10001 11110 10001 10001 11110",
        C: "01110 10001 10000 10000 10000 10001 01110",
        D: "11110 10001 10001 10001 10001 10001 11110",
        E: "11111 10000 10000 11110 10000 10000 11111",
        F: "11111 10000 10000 11110 10000 10000 10000",
        G: "01110 10001 10000 10111 10001 10001 01111",
        H: "10001 10001 10001 11111 10001 10001 10001",
        I: "01110 00100 00100 00100 00100 00100 01110",
        J: "00111 00010 00010 00010 00010 10010 01100",
        K: "10001 10010 10100 11000 10100 10010 10001",
        L: "10000 10000 10000 10000 10000 10000 11111",
        M: "10001 11011 10101 10101 10001 10001 10001",
        N: "10001 11001 10101 10011 10001 10001 10001",
        O: "01110 10001 10001 10001 10001 10001 01110",
        P: "11110 10001 10001 11110 10000 10000 10000",
        Q: "01110 10001 10001 10001 10101 10010 01101",
        R: "11110 10001 10001 11110 10100 10010 10001",
        S: "01111 10000 10000 01110 00001 00001 11110",
        T: "11111 00100 00100 00100 00100 00100 00100",
        U: "10001 10001 10001 10001 10001 10001 01110",
        V: "10001 10001 10001 10001 10001 01010 00100",
        W: "10001 10001 10001 10101 10101 11011 10001",
        X: "10001 10001 01010 00100 01010 10001 10001",
        Y: "10001 10001 01010 00100 00100 00100 00100",
        Z: "11111 00001 00010 00100 01000 10000 11111",
        0: "01110 10001 10011 10101 11001 10001 01110",
        1: "00100 01100 00100 00100 00100 00100 01110",
        2: "01110 10001 00001 00010 00100 01000 11111",
        3: "11110 00001 00001 01110 00001 00001 11110",
        4: "00010 00110 01010 10010 11111 00010 00010",
        5: "11111 10000 11110 00001 00001 10001 01110",
        6: "00110 01000 10000 11110 10001 10001 01110",
        7: "11111 00001 00010 00100 01000 01000 01000",
        8: "01110 10001 10001 01110 10001 10001 01110",
        9: "01110 10001 10001 01111 00001 00010 01100",
        "!": "00100 00100 00100 00100 00100 00000 00100",
        "?": "01110 10001 00001 00010 00100 00000 00100",
        "-": "00000 00000 00000 11111 00000 00000 00000",
        ".": "00000 00000 00000 00000 00000 00000 00100",
        ",": "00000 00000 00000 00000 00000 00100 01000",
        "'": "00100 00100 01000 00000 00000 00000 00000",
        "&": "01100 10010 10100 01000 10101 10010 01101",
      };
      for (const ch of Object.keys(FONT)) FONT[ch] = FONT[ch].split(" ");

      let banner = []; // cells of the big message
      let bannerLetters = 0;
      let notes = []; // one-character-per-cell text lines
      let noteCol = 0;

      // Words reduced to what the pixel font can draw (accents stripped).
      function fontWords(text) {
        return text
          .normalize("NFD")
          .toUpperCase()
          .split(/\s+/)
          .map((word) =>
            Array.from(word)
              .filter((ch) => FONT[ch])
              .join(""),
          )
          .filter(Boolean);
      }

      // Wrap words into lines of pixel-font text, or null if a word cannot fit.
      // Each font pixel is `pw` cells wide and one cell tall (cells are narrow).
      function wrapPixelText(words, availW, pw) {
        const maxChars = Math.floor((availW + pw) / (6 * pw));
        if (
          !words.length ||
          maxChars < Math.max(...words.map((word) => word.length))
        )
          return null;
        const lines = [];
        let line = "";
        for (const word of words) {
          const next = line ? `${line} ${word}` : word;
          if (next.length <= maxChars) line = next;
          else {
            lines.push(line);
            line = word;
          }
        }
        lines.push(line);
        return { pw, lines, height: lines.length * 7 + (lines.length - 1) * 2 };
      }

      // Turn a wrapped block into grid cells; returns how many letters it holds.
      function emitPixelText(layout, topRow, centerCol, out) {
        const { pw, lines } = layout;
        let order = 0,
          row = topRow;
        for (const line of lines) {
          let col0 = Math.round(centerCol - (line.length * 6 * pw - pw) / 2);
          for (const ch of line) {
            const bits = FONT[ch];
            if (bits) {
              const glyph = getGlyph(ch); // each big letter is built from itself
              for (let ry = 0; ry < 7; ry++) {
                for (let rx = 0; rx < 5; rx++) {
                  if (bits[ry][rx] !== "1") continue;
                  for (let k = 0; k < pw; k++) {
                    const col = col0 + rx * pw + k,
                      r = row + ry;
                    if (col < 0 || col >= cols || r < 0 || r >= rows) continue;
                    out.push({ c: r * cols + col, col, row: r, glyph, order });
                  }
                }
              }
              order++;
            }
            col0 += 6 * pw;
          }
          row += 9;
        }
        return order;
      }

      function buildOverlay() {
        banner = [];
        notes = [];
        bannerLetters = 0;
        const words = fontWords(CONFIG.message);
        const from = CONFIG.from.trim();

        // Free area: the sky above the star in portrait, the left margin in landscape.
        const portrait = heightPx >= widthPx;
        const starY = STAR_Y - LOOK_Y;
        const starW = (CAM_DIST / (CAM_DIST - starY * SIN_P)) * scale;
        const starTopPx = centerY - (starY * COS_P + 0.6) * starW;
        const colMin = 2,
          rowMin = 2;
        const colMax = portrait
          ? cols - 2
          : Math.floor((centerX - 1.5 * scale - gridX) / cellW);
        const rowMax = portrait
          ? Math.floor((starTopPx - gridY) / cellH) - 1
          : rows - 3;
        const availW = colMax - colMin,
          availH = rowMax - rowMin;

        // Custom greetings remain optional; the default sky belongs to Santa.
        const fromRows = from ? 2 : 0;
        const plainBanner = words.length ? { plain: true, height: 1 } : null;
        const bannerChoices = [
          wrapPixelText(words, availW, 2),
          wrapPixelText(words, availW, 1),
          plainBanner,
        ];
        const top = bannerChoices.find((choice) =>
          choice && (choice.height + fromRows <= availH || choice.plain),
        );
        const blockHeight = (top ? top.height : 0) + fromRows;

        const centerCol = (colMin + colMax) / 2;
        const centerRow = portrait ? (rowMin + rowMax) / 2 : rows * 0.42;
        let row = Math.max(
          rowMin,
          Math.round(centerRow - blockHeight / 2),
        );
        noteCol = centerCol;

        if (top) {
          if (top.plain)
            notes.push({ row, text: CONFIG.message.trim(), tone: 0 });
          else bannerLetters = emitPixelText(top, row, centerCol, banner);
          row += top.height;
        }
        if (from)
          notes.push({ row: row + 1, text: `- from ${from} -`, tone: 2 });
      }

      function clearCell(c) {
        const row = (c / cols) | 0;
        let base =
          (gridY + row * cellH) * widthPx + gridX + (c - row * cols) * cellW;
        for (let y = 0; y < cellH; y++, base += widthPx)
          pixels.fill(BLACK, base, base + cellW);
      }

      function blit(c, glyph, R, G, B) {
        const row = (c / cols) | 0;
        const base =
          (gridY + row * cellH) * widthPx + gridX + (c - row * cols) * cellW;
        const r8 = clamp01(R) * 255,
          g8 = clamp01(G) * 255,
          b8 = clamp01(B) * 255;
        const off = glyph.off,
          alpha = glyph.alpha;
        for (let k = 0; k < off.length; k++) {
          const a = alpha[k];
          pixels[base + off[k]] =
            BLACK |
            (((b8 * a) >> 8) << 16) |
            (((g8 * a) >> 8) << 8) |
            ((r8 * a) >> 8);
        }
      }

      // Returns the number of characters drawn.
      function drawOverlay(t, tAbs, cosT, sinT) {
        let drawn = 0;

        // banner: letters arrive one by one with a white flash, then shimmer in gold
        for (const cell of banner) {
          const age = t - (T_MESSAGE + cell.order * 0.12);
          if (age < 0) continue;
          if (cellIdx[cell.c] >= 0) continue; // the tree stays in front
          const wave =
            0.78 +
            0.22 * Math.sin(tAbs * 2.2 - cell.col * 0.22 + cell.row * 0.3);
          const flash = age < 0.5 ? 1 - age / 0.5 : 0;
          clearCell(cell.c);
          blit(
            cell.c,
            cell.glyph,
            1.0 * wave + flash,
            0.8 * wave + flash,
            0.28 * wave + flash,
          );
          drawn++;
        }

        // plain-text lines (signature, and fallbacks when the big text cannot fit)
        const notesStart = T_MESSAGE + bannerLetters * 0.12 + 0.3;
        for (const note of notes) {
          const shown = Math.floor((t - notesStart - note.tone * 0.3) / 0.035);
          if (shown <= 0 || note.row < 0 || note.row >= rows) continue;
          const text = note.text;
          const col0 = Math.round(noteCol - text.length / 2);
          const k = note.tone === 2 ? 0.55 : 0.85;
          for (let j = 0; j < text.length && j < shown; j++) {
            const col = col0 + j;
            if (col < 0 || col >= cols || text[j] === " ") continue;
            const c = note.row * cols + col;
            if (cellIdx[c] >= 0) continue;
            clearCell(c);
            blit(c, getGlyph(text[j]), 0.8 * k, 0.85 * k, 1.0 * k);
            drawn++;
          }
        }

        // gift tags: a name under each gift while it faces the viewer
        scene.gifts.forEach((gift, gi) => {
          const name = (CONFIG.gifts[gi] || "").trim();
          if (!name || t < gift.t0 + 1.0) return;
          const xr = gift.x * cosT + gift.z * sinT;
          const zr = -gift.x * sinT + gift.z * cosT;
          const facing =
            smoothstep(0.15, 0.6, zr) * clamp01((t - gift.t0 - 1.0) / 0.5);
          if (facing < 0.03) return;
          const zf = zr + 0.25; // just in front of the box
          const yv = -LOOK_Y * COS_P - zf * SIN_P;
          const zv = -LOOK_Y * SIN_P + zf * COS_P;
          const w = (CAM_DIST / (CAM_DIST - zv)) * scale;
          const row = Math.floor((centerY - yv * w - gridY) / cellH) + 1;
          if (row < 0 || row >= rows) return;
          const col0 = Math.round(
            (centerX + xr * w - gridX) / cellW - name.length / 2,
          );
          for (let j = -1; j <= name.length; j++) {
            // one blank cell of padding each side
            const col = col0 + j;
            if (col < 0 || col >= cols) continue;
            const c = row * cols + col;
            clearCell(c);
            if (j < 0 || j >= name.length || name[j] === " ") continue;
            blit(
              c,
              getGlyph(name[j]),
              (0.6 + 0.4 * gift.rib[0]) * facing,
              (0.6 + 0.4 * gift.rib[1]) * facing,
              (0.6 + 0.4 * gift.rib[2]) * facing,
            );
            drawn++;
          }
        });
        return drawn;
      }

      // ---------------------------------------------------------------- Santa's sleigh
      // Little ASCII actors follow the same shallow arc, with a small time/space
      // offset for each reindeer. No loops, sharp turns, or whole-train wobbling.
      const DEER = [
        String.raw`        \ /| `,
        String.raw`     \   Y | `,
        String.raw`      \ /o_>*`,
        String.raw`  .----' /   `,
        String.raw` /      /    `,
        String.raw` '-.__.-     `,
        String.raw`   / /  \ \  `,
      ];
      const SLEIGH = [
        "        __       ",
        "       /RR*      ",
        "       (oo)  GG  ",
        "   PP  {ww} GGG  ",
        String.raw`  PPP  /RR\_GGG  `,
        String.raw` /RRRRRRRRRRRRR\_`,
        String.raw` \______________/`,
        "  =============/ ",
      ];
      let santaNose = null;

      function sleighFlight(tAbs) {
        const cycle = 30;
        const duration = 22;
        const elapsed = ((tAbs % cycle) + cycle) % cycle;
        if (elapsed >= duration) return null;
        const deerCount = widthPx < 600 * dpr ? 2 : 3;
        const spacing = 16 * cellW;
        const trainWidth = (19 + deerCount * 16) * cellW;
        const headX = -18 * cellW +
          (widthPx + trainWidth + 36 * cellW) * (elapsed / duration);
        const starY = STAR_Y - LOOK_Y;
        const starW = (CAM_DIST / (CAM_DIST - starY * SIN_P)) * scale;
        const starTop = centerY - (starY * COS_P + STAR_R) * starW;
        const baseY = Math.max(3 * cellH, Math.min(heightPx * 0.16, starTop - 10 * cellH));
        const arc = Math.min(heightPx * 0.045, baseY * 0.32);
        const pathY = (x) => {
          const p = clamp01(x / widthPx);
          return baseY - arc * Math.sin(Math.PI * p);
        };
        return { headX, spacing, deerCount, trainWidth, pathY };
      }

      function drawSanta(t, tAbs) {
        santaNose = null;
        if (!CONFIG.santa || t < 2) return 0;
        const flight = sleighFlight(tAbs);
        if (!flight) return 0;
        let drawn = 0;
        const stamp = (sprite, x, y, colorFor, stride = -1) => {
          const col0 = Math.round((x - gridX) / cellW);
          const row0 = Math.round((y - gridY) / cellH);
          for (let row = 0; row < sprite.length; row++) {
            // A two-pose gallop changes only the legs, not the whole silhouette.
            const line = stride >= 0 && row === 6
              ? (Math.sin(tAbs * 7 + stride * 0.8) > 0
                ? String.raw`   / /  \ \  ` : String.raw`   \ \  / /  `)
              : sprite[row];
            for (let col = 0; col < line.length; col++) {
              const ch = line[col];
              if (ch === " ") continue;
              const cx = col0 + col, cy = row0 + row;
              if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) continue;
              const cell = cy * cols + cx;
              if (cellIdx[cell] >= 0) continue;
              const color = colorFor(ch, row, col);
              clearCell(cell);
              blit(cell, getGlyph(ch === "R" || ch === "G" || ch === "P" ? "#" : ch === "w" ? "@" : ch), ...color);
              drawn++;
              if (stride === 0 && ch === "*") {
                santaNose = { x: gridX + (cx + 0.5) * cellW, y: gridY + (cy + 0.5) * cellH };
              }
            }
          }
        };
        const { headX, spacing, deerCount, pathY } = flight;
        // Fine golden reins connect each actor along the curve.
        const tailX = headX - deerCount * spacing;
        for (let x = tailX + 14 * cellW; x < headX + 5 * cellW; x += cellW) {
          const col = Math.round((x - gridX) / cellW);
          const row = Math.round((pathY(x) + 4 * cellH - gridY) / cellH);
          if (col < 0 || col >= cols || row < 0 || row >= rows) continue;
          const cell = row * cols + col;
          if (cellIdx[cell] >= 0) continue;
          clearCell(cell);
          blit(cell, getGlyph("~"), 0.55, 0.34, 0.12);
          drawn++;
        }
        // Draw the sleigh first, then the team, with Rudolph at the leading end.
        stamp(SLEIGH, tailX, pathY(tailX + 8 * cellW) + cellH, (ch, row) => {
          if (ch === "w" || ch === "*" || ch === "_" && row === 0) return [1, 0.96, 0.86];
          if (ch === "o" || row === 2 && (ch === "(" || ch === ")")) return [1, 0.73, 0.55];
          if (ch === "G") return [0.2, 0.75, 0.43];
          if (ch === "P") return [0.88, 0.55, 0.9];
          if (row >= 6) return [1, 0.77, 0.3];
          return [1, 0.2, 0.28];
        });
        for (let i = deerCount - 1; i >= 0; i--) {
          const x = headX - i * spacing;
          stamp(DEER, x, pathY(x + 6 * cellW), (ch, row) => {
            if (ch === "*") return i === 0 ? [1, 0.12, 0.16] : [0.92, 0.65, 0.32];
            if (ch === "o") return [1, 0.94, 0.76];
            return row < 2 ? [0.85, 0.69, 0.44] : [0.82, 0.5, 0.24];
          }, i);
        }
        // A restrained sparkling wake, not a solid line across the sky.
        for (let i = 0; i < 12; i++) {
          const x = tailX - (i + 1) * cellW * 2;
          const y = pathY(x) + (4 + Math.sin(tAbs * 2 + i * 1.7)) * cellH;
          const col = Math.round((x - gridX) / cellW), row = Math.round((y - gridY) / cellH);
          if (col < 0 || col >= cols || row < 0 || row >= rows) continue;
          const cell = row * cols + col;
          if (cellIdx[cell] >= 0) continue;
          const b = (1 - i / 12) * (0.4 + 0.2 * Math.sin(tAbs * 5 + i));
          blit(cell, getGlyph(i % 4 ? "." : "+"), b, b * 0.8, b * 0.4);
          drawn++;
        }
        return drawn;
      }

      // ---------------------------------------------------------------- fireworks
      // Shells rise and burst in a plane behind the tree, in view space.
      const FW_COLORS = [
        [1.0, 0.82, 0.35],
        [1.0, 0.3, 0.25],
        [0.45, 1.0, 0.55],
        [0.4, 0.65, 1.0],
        [1.0, 0.45, 0.9],
        [0.95, 0.95, 1.0],
      ];
      const FW_RAMP = ".+*@";
      const FW_Z = -2.5;
      const FW_TRAIL = 6;
      const fwRng = makeRng(2026);
      const fireworks = [];
      let fwClock = 0,
        fwNext = 0;
      let fwSprites = [],
        fwGlyphs = [];

      function launchFirework() {
        const w = (CAM_DIST / (CAM_DIST - FW_Z)) * scale;
        const halfW = widthPx / 2 / w,
          top = centerY / w;
        const n = 160 + Math.floor(fwRng.u() * 90);
        fireworks.push({
          x: fwRng.range(-0.8, 0.8) * halfW,
          y0: -1.2,
          y1: fwRng.range(0.3, 0.85) * top,
          age: 0,
          rise: fwRng.range(0.65, 1.0),
          burst: false,
          burstAge: 0,
          trailTimer: 0,
          color: Math.floor(fwRng.u() * FW_COLORS.length),
          speed: fwRng.range(1.45, 2.15),
          ring: fwRng.u() < 0.35,
          phase: fwRng.u() * TAU,
          echo: false,
          n,
          px: new Float32Array(n),
          py: new Float32Array(n),
          vx: new Float32Array(n),
          vy: new Float32Array(n),
          life: new Float32Array(n),
          hx: new Float32Array(n * FW_TRAIL),
          hy: new Float32Array(n * FW_TRAIL),
        });
      }

      function stepFireworks(dt, active) {
        fwClock += dt;
        if (active && fwClock >= fwNext && fireworks.length < 6) {
          launchFirework();
          fwNext = fwClock + fwRng.range(0.85, 1.8);
        }
        for (let s = fireworks.length - 1; s >= 0; s--) {
          const f = fireworks[s];
          f.age += dt;
          if (!f.burst) {
            if (f.age < f.rise) continue;
            f.burst = true;
            for (let i = 0; i < f.n; i++) {
              // Alternate airy chrysanthemums and crisp outer rings, with a
              // faster halo and a softer inner bloom rather than one flat puff.
              const a = (i / f.n) * TAU + f.phase + fwRng.range(-0.035, 0.035);
              const shell = f.ring ? (i % 4 ? 1 : 0.52) : Math.sqrt(fwRng.range(0.08, 1));
              const speed = f.speed * shell * fwRng.range(0.88, 1.12);
              f.vx[i] = Math.cos(a) * speed;
              f.vy[i] = Math.sin(a) * speed * 0.88;
              f.px[i] = f.x;
              f.py[i] = f.y1;
              f.life[i] = fwRng.range(1.8, 3.1);
            }
            f.hx.fill(f.x);
            f.hy.fill(f.y1);
            continue;
          }
          f.burstAge += dt;
          if (!f.echo && f.burstAge > 0.5) {
            // A handful of little secondary crackles break away from the bloom.
            f.echo = true;
            for (let i = 0; i < f.n; i += 11) {
              const a = i * 2.39996 + f.phase;
              f.vx[i] += Math.cos(a) * 0.85;
              f.vy[i] += Math.sin(a) * 0.85;
              f.life[i] += 0.3;
            }
          }
          if (f.burstAge > 3.4) {
            fireworks.splice(s, 1);
            continue;
          }
          f.trailTimer += dt;
          const shift = f.trailTimer > 0.035;
          if (shift) f.trailTimer = 0;
          const drag = Math.exp(-0.85 * dt);
          for (let i = 0; i < f.n; i++) {
            if (shift) {
              const h = i * FW_TRAIL;
              for (let k = FW_TRAIL - 1; k > 0; k--) {
                f.hx[h + k] = f.hx[h + k - 1];
                f.hy[h + k] = f.hy[h + k - 1];
              }
              f.hx[h] = f.px[i];
              f.hy[h] = f.py[i];
            }
            f.vx[i] *= drag;
            f.vy[i] = f.vy[i] * drag - 0.38 * dt;
            f.px[i] += f.vx[i] * dt;
            f.py[i] += f.vy[i] * dt;
          }
        }
      }

      // Returns the number of characters drawn. Sparks only use empty sky cells.
      function drawFireworks(tAbs) {
        if (!fireworks.length) return 0;
        const w = (CAM_DIST / (CAM_DIST - FW_Z)) * scale;
        let drawn = 0;
        const plot = (xv, yv, glyph, R, G, B) => {
          const fx = (centerX + xv * w - gridX) / cellW;
          const fy = (centerY - yv * w - gridY) / cellH;
          if (fx < 0 || fy < 0 || fx >= cols || fy >= rows) return;
          const c = (fy | 0) * cols + (fx | 0);
          if (cellIdx[c] >= 0 || groundDepth[c] === groundDepth[c]) return; // tree or ground in front
          // Accumulate overlapping sparks instead of erasing the trail or the
          // next firework that was already painted into this sky cell.
          const row = (c / cols) | 0;
          const base = (gridY + row * cellH) * widthPx + gridX + (c - row * cols) * cellW;
          for (let k = 0; k < glyph.off.length; k++) {
            const offset = base + glyph.off[k], old = pixels[offset];
            const a = glyph.alpha[k];
            const r = Math.min(255, (old & 255) + Math.round(clamp01(R) * a));
            const g = Math.min(255, ((old >>> 8) & 255) + Math.round(clamp01(G) * a));
            const b = Math.min(255, ((old >>> 16) & 255) + Math.round(clamp01(B) * a));
            pixels[offset] = BLACK | (b << 16) | (g << 8) | r;
          }
          drawn++;
        };
        for (const f of fireworks) {
          const col = FW_COLORS[f.color];
          if (!f.burst) {
            // the rising shell
            const p = f.age / f.rise;
            const y = f.y0 + (f.y1 - f.y0) * (1 - (1 - p) * (1 - p));
            for (let k = 1; k <= 5; k++) {
              const b = 0.65 * (1 - k / 6);
              plot(f.x + 0.025 * Math.sin(tAbs * 17 + k), y - k * 0.07, fwGlyphs[0], b, b * 0.65, b * 0.3);
            }
            plot(f.x, y, fwGlyphs[2], 1.0, 0.9, 0.7);
            continue;
          }
          const white = Math.max(0, 1 - f.burstAge / 0.2);
          for (let i = 0; i < f.n; i++) {
            const frac = f.burstAge / f.life[i];
            if (frac >= 1) continue;
            let b = Math.pow(1 - frac, 0.65);
            if (frac > 0.45) b *= 0.65 + 0.35 * Math.sin(tAbs * 24 + i * 2.1);
            const sparkColor = i % 11 === 0 ? FW_COLORS[5] : col;
            for (let k = FW_TRAIL - 1; k >= 0; k--) {
              const tb = b * 0.58 * Math.pow(1 - k / FW_TRAIL, 1.3);
              plot(
                f.hx[i * FW_TRAIL + k],
                f.hy[i * FW_TRAIL + k],
                fwGlyphs[0],
                sparkColor[0] * tb,
                sparkColor[1] * tb,
                sparkColor[2] * tb,
              );
            }
            const level = Math.min(
              FW_RAMP.length - 1,
              (b * FW_RAMP.length) | 0,
            );
            plot(
              f.px[i],
              f.py[i],
              fwGlyphs[level],
              (sparkColor[0] + (1 - sparkColor[0]) * white) * b,
              (sparkColor[1] + (1 - sparkColor[1]) * white) * b,
              (sparkColor[2] + (1 - sparkColor[2]) * white) * b,
            );
          }
        }
        return drawn;
      }

      // Additive flash at each burst; expects 'lighter' compositing to be active.
      function drawFireworkGlow() {
        const w = (CAM_DIST / (CAM_DIST - FW_Z)) * scale;
        for (const f of fireworks) {
          if (!f.burst) continue;
          const a =
            0.85 * Math.max(0, 1 - f.burstAge / 0.28) +
            0.2 * Math.max(0, 1 - f.burstAge / 1.8);
          if (a <= 0.01) continue;
          const sprite = fwSprites[f.color];
          ctx.globalAlpha = a;
          ctx.drawImage(
            sprite,
            centerX + f.x * w - sprite.width / 2,
            centerY - f.y1 * w - sprite.height / 2,
          );
        }
      }

      // ---------------------------------------------------------------- frame
      const hudState = { letters: 0, lights: 0, fps: 0 };
      let buildStart = performance.now();
      const spinStart = buildStart;
      let lastFrame = buildStart;
      let frozenPrimed = false;

      function render(t, tAbs, dt) {
        const { P, N, C, K, T, PH, SH, O, count } = scene;
        const theta = (tAbs * TAU) / OPT.spin;
        const cosT = Math.cos(theta),
          sinT = Math.sin(theta);
        const invCW = 1 / cellW,
          invCH = 1 / cellH;

        cellZ.fill(-Infinity);
        cellIdx.fill(-1);
        pixels.fill(BLACK);

        // 1. project every visible point; the nearest one wins its cell
        for (let i = 0, i3 = 0; i < count; i++, i3 += 3) {
          if (t < T[i]) {
            ptCell[i] = -1;
            continue;
          }
          const x = P[i3],
            y = P[i3 + 1] - LOOK_Y,
            z = P[i3 + 2];
          const billboard = K[i] === STAR; // the star ignores the spin
          const xr = billboard ? x : x * cosT + z * sinT;
          const zr = billboard ? z : -x * sinT + z * cosT;
          const yv = y * COS_P - zr * SIN_P;
          let zv = y * SIN_P + zr * COS_P;
          const w = (CAM_DIST / (CAM_DIST - zv)) * scale;
          const fx = (centerX + xr * w - gridX) * invCW;
          const fy = (centerY - yv * w - gridY) * invCH;
          if (fx < 0 || fy < 0 || fx >= cols || fy >= rows) {
            ptCell[i] = -1;
            continue;
          }
          if (K[i] === LIGHT) zv += 0.12; // lights sit just above the needles
          const c = (fy | 0) * cols + (fx | 0);
          ptCell[i] = c;
          ptSub[i] = ((fx * 2) & 1) | (((fy * 2) & 1) << 1);
          if (zv > cellZ[c]) {
            cellZ[c] = zv;
            cellIdx[c] = i;
          }
        }

        // 1b. sub-cell coverage: which quadrants does the winning object fill?
        cellMask.fill(0);
        for (let i = 0; i < count; i++) {
          const c = ptCell[i];
          if (c < 0) continue;
          const win = cellIdx[c];
          if (O[win] === O[i]) cellMask[c] |= 1 << ptSub[i];
        }

        // 2. snowflakes live in view space (they do not rotate with the tree)
        {
          const f = flakes;
          const span = f.top - f.bottom;
          for (let j = 0; j < f.count; j++) {
            f.y[j] -= f.speed[j] * dt;
            if (f.y[j] < f.bottom) f.y[j] += span;
            const xv = f.x[j] + 0.18 * Math.sin(tAbs * 0.65 + f.phase[j]) +
              0.05 * Math.sin(tAbs * 1.3 + f.phase[j] * 2);
            const zv = f.z[j];
            const w = (CAM_DIST / (CAM_DIST - zv)) * scale;
            const fx = (centerX + xv * w - gridX) * invCW;
            const fy = (centerY - f.y[j] * w - gridY) * invCH;
            if (fx < 0 || fy < 0 || fx >= cols || fy >= rows) continue;
            const c = (fy | 0) * cols + (fx | 0);
            if (zv > cellZ[c]) {
              cellZ[c] = zv;
              cellIdx[c] = -2 - j;
            }
          }
        }

        // 3. shade each cell and blit its glyph
        const reveal = GROUND_R * (1 - Math.pow(1 - clamp01(t / 1.2), 3));
        const rimFade = clamp01(1.9 - t);
        const lightsLevel = clamp01((t - T_LIGHTS) / 1.5);
        let letters = 0;
        const total = cols * rows;
        for (let c = 0; c < total; c++) {
          let i = cellIdx[c];
          let shape = 0; // 0 = brightness ramp, else outline glyph
          if (i >= 0 && EDGE_KIND[K[i]] && cellMask[c] !== 15) {
            const col = c % cols;
            const nl = col > 0 ? cellIdx[c - 1] : -1;
            const nr = col < cols - 1 ? cellIdx[c + 1] : -1;
            const nu = c >= cols ? cellIdx[c - cols] : -1;
            const nd = c < total - cols ? cellIdx[c + cols] : -1;
            if (SOLID_KIND[K[i]]) {
              // solid: outlined against anything else
              const o = O[i];
              if (
                nl < 0 ||
                nr < 0 ||
                nu < 0 ||
                nd < 0 ||
                O[nl] !== o ||
                O[nr] !== o ||
                O[nu] !== o ||
                O[nd] !== o
              )
                shape = cellMask[c];
            } else if (nl < 0 && nr < 0 && nu < 0 && nd < 0) {
              i = -1; // lone speck floating off the tree
            } else if (nl < 0 || nr < 0 || nu < 0 || nd < 0) {
              shape = cellMask[c]; // foliage: outlined against the sky
            }
          }
          const gz = groundDepth[c];
          const hasGround = gz === gz && groundR[c] < reveal;
          let R = 0,
            G = 0,
            B = 0,
            kind;

          if (i === -1 || (hasGround && gz > cellZ[c])) {
            if (!hasGround) continue;
            kind = GROUND;
            const r = groundR[c];
            const xt = groundX[c] * cosT - groundZ[c] * sinT; // texture spins with the tree
            const zt = groundX[c] * sinT + groundZ[c] * cosT;
            const q = r / GROUND_R;
            const fade = Math.pow(1 - q * q, 1.4);
            const drift =
              0.78 +
              0.22 *
                Math.sin(xt * 4.1 + Math.sin(zt * 2.7) * 1.3) *
                Math.cos(zt * 3.3 + xt * 0.7);
            const shadow = 0.45 + 0.55 * smoothstep(0.25, 1.15, r);
            const rim = Math.max(0, 1 - (reveal - r) / 0.3) * rimFade;
            const v = fade * drift * shadow * 1.05 + rim;
            const warm = lightsLevel * Math.exp(-r * 1.4) * 0.35;
            R = 0.62 * v + warm;
            G = 0.68 * v + warm * 0.62;
            B = 0.85 * v + warm * 0.2;
          } else if (i <= -2) {
            kind = FLAKE;
            const b = flakes.bright[-2 - i];
            R = 0.85 * b;
            G = 0.9 * b;
            B = b;
          } else {
            kind = K[i];
            const i3 = i * 3;
            const nx = N[i3],
              ny = N[i3 + 1],
              nz = N[i3 + 2];
            const nxr = nx * cosT + nz * sinT;
            const nzr = -nx * sinT + nz * cosT;
            const diff = Math.max(0, nxr * LX + ny * LY + nzr * LZ);
            const depth = 0.8 + 0.2 * clamp01((cellZ[c] + 1.2) / 2.4);
            const r0 = C[i3],
              g0 = C[i3 + 1],
              b0 = C[i3 + 2];
            if (kind === LIGHT) {
              const tw =
                0.55 + 0.45 * Math.sin(tAbs * (1.5 + SH[i] * 2.5) + PH[i]);
              const k = 0.7 + 0.5 * tw;
              R = r0 * k;
              G = g0 * k;
              B = b0 * k;
            } else if (kind === BALL) {
              const li = (0.35 + 0.75 * diff) * depth;
              const spec =
                Math.pow(Math.max(0, nxr * HX + ny * HY + nzr * HZ), 30) * 0.9;
              R = r0 * li + spec;
              G = g0 * li + spec;
              B = b0 * li + spec;
            } else if (kind === GARLAND) {
              const shimmer =
                (0.65 + 0.35 * Math.sin(tAbs * 5 + PH[i])) *
                (0.6 + 0.5 * diff) *
                depth;
              const sparkle = Math.pow(
                Math.max(0, Math.sin(tAbs * 2.3 + PH[i] * 7)),
                20,
              );
              R = r0 * shimmer + sparkle;
              G = g0 * shimmer + sparkle;
              B = b0 * shimmer + sparkle;
            } else if (kind === STAR) {
              const k = 0.9 + 0.2 * Math.sin(tAbs * 3);
              R = r0 * k;
              G = g0 * k;
              B = b0 * k;
            } else {
              const li = (0.45 + 0.75 * diff) * depth;
              R = r0 * li;
              G = g0 * li;
              B = b0 * li;
            }
            const gain = GAIN[kind];
            R *= gain;
            G *= gain;
            B *= gain;
            if (kind !== LIGHT) {
              // new points flash white as they appear
              const age = t - T[i];
              if (age < 0.45) {
                const fl = (1 - age / 0.45) * 0.9;
                R += (1 - R) * fl;
                G += (1 - G) * fl;
                B += (1 - B) * fl;
              }
            }
          }

          if (R > 1) R = 1;
          if (G > 1) G = 1;
          if (B > 1) B = 1;
          const peak = R > G ? (R > B ? R : B) : G > B ? G : B;
          if (peak < 0.02) continue;
          const ramp = ramps[kind];
          let level = (Math.pow(peak, 0.6) * ramp.length) | 0;
          if (level >= ramp.length) level = ramp.length - 1;
          const glyph = shape ? shapeGlyphs[shape] : ramp[level];
          const off = glyph.off,
            alpha = glyph.alpha;
          const row = (c / cols) | 0;
          const base =
            (gridY + row * cellH) * widthPx + gridX + (c - row * cols) * cellW;
          const r8 = R * 255,
            g8 = G * 255,
            b8 = B * 255;
          for (let k = 0; k < off.length; k++) {
            const a = alpha[k];
            pixels[base + off[k]] =
              BLACK |
              (((b8 * a) >> 8) << 16) |
              (((g8 * a) >> 8) << 8) |
              ((r8 * a) >> 8);
          }
          letters++;
        }

        // 3b. Fireworks behind the optional greeting and Santa's passing team.
        letters += drawFireworks(tAbs);
        letters += drawOverlay(t, tAbs, cosT, sinT);
        letters += drawSanta(t, tAbs);
        ctx.putImageData(image, 0, 0);

        // 4. additive glow for lights that are actually visible
        ctx.globalCompositeOperation = "lighter";
        let lightsOn = 0;
        for (const light of scene.lights) {
          const i = light.index;
          if (t < T[i]) continue;
          lightsOn++;
          const i3 = i * 3;
          const x = P[i3],
            y = P[i3 + 1] - LOOK_Y,
            z = P[i3 + 2];
          const xr = x * cosT + z * sinT;
          const zr = -x * sinT + z * cosT;
          const yv = y * COS_P - zr * SIN_P;
          const zv = y * SIN_P + zr * COS_P;
          const w = (CAM_DIST / (CAM_DIST - zv)) * scale;
          const sx = centerX + xr * w,
            sy = centerY - yv * w;
          const fx = (sx - gridX) * invCW,
            fy = (sy - gridY) * invCH;
          if (fx < 0 || fy < 0 || fx >= cols || fy >= rows) continue;
          if (cellIdx[(fy | 0) * cols + (fx | 0)] !== i) continue; // hidden behind the tree
          const tw = 0.55 + 0.45 * Math.sin(tAbs * (1.5 + SH[i] * 2.5) + PH[i]);
          const sprite = glowSprites[light.color];
          ctx.globalAlpha = tw;
          ctx.drawImage(sprite, sx - sprite.width / 2, sy - sprite.height / 2);
        }

        // 5. star glow and rays
        const starOn = clamp01((t - T_STAR) / 0.6);
        if (starOn > 0) {
          const yv = (STAR_Y - LOOK_Y) * COS_P;
          const zv = (STAR_Y - LOOK_Y) * SIN_P;
          const w = (CAM_DIST / (CAM_DIST - zv)) * scale;
          const sx = centerX,
            sy = centerY - yv * w;
          const pulse = 0.85 + 0.15 * Math.sin(tAbs * 2.1);
          ctx.globalAlpha = starOn * pulse;
          ctx.drawImage(
            starSprite,
            sx - starSprite.width / 2,
            sy - starSprite.height / 2,
          );
          ctx.lineWidth = Math.max(1.5, dpr * 1.5);
          ctx.setLineDash([cellW * 0.7, cellW * 0.5]);
          ctx.strokeStyle = "rgb(255, 225, 140)";
          for (let k = 0; k < 8; k++) {
            const a = (k * Math.PI) / 4 + Math.PI / 2;
            const len =
              (k % 2 === 0 ? 0.52 : 0.34) *
              scale *
              (0.85 + 0.15 * Math.sin(tAbs * 2.4 + k * 1.7));
            const inner = 0.25 * scale;
            ctx.globalAlpha = starOn * (k % 2 === 0 ? 0.95 : 0.6);
            ctx.beginPath();
            ctx.moveTo(sx + Math.cos(a) * inner, sy - Math.sin(a) * inner);
            ctx.lineTo(sx + Math.cos(a) * len, sy - Math.sin(a) * len);
            ctx.stroke();
          }
          ctx.setLineDash([]);
        }
        drawFireworkGlow();
        if (santaNose) {
          ctx.globalAlpha = 0.75 + 0.15 * Math.sin(tAbs * 4);
          const noseGlow = glowSprites[2];
          ctx.drawImage(noseGlow, santaNose.x - noseGlow.width / 2, santaNose.y - noseGlow.height / 2);
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";

        hudState.letters = letters;
        hudState.lights = lightsOn;

        // 6. optional status overlay
        if (OPT.hud) {
          const size = Math.max(11 * dpr, cellH);
          const pad = size * 1.2;
          const deg = (((theta * 360) / TAU) % 360).toFixed(2).padStart(6, "0");
          ctx.font = `${size}px Consolas, Menlo, monospace`;
          ctx.fillStyle = "rgba(150, 160, 190, 0.6)";
          ctx.textBaseline = "alphabetic";
          ctx.textAlign = "left";
          ctx.fillText(
            `rotation ${deg}°    lights ${lightsOn}`,
            pad,
            heightPx - pad - size * 1.4,
          );
          ctx.fillText(
            `letters ${letters.toLocaleString("en-US")}`,
            pad,
            heightPx - pad,
          );
          ctx.textAlign = "right";
          ctx.fillText(
            `${Math.round(hudState.fps)} fps`,
            widthPx - pad,
            heightPx - pad,
          );
        }
      }

      function frame(now) {
        requestAnimationFrame(frame);
        if (OPT.fps > 0 && now - lastFrame < 1000 / OPT.fps - 1) return;
        const dt = Math.min(0.1, (now - lastFrame) / 1000);
        lastFrame = now;
        if (dt > 0) hudState.fps += (1 / dt - hudState.fps) * 0.05;

        codeTick(dt);

        if (OPT.freeze !== null) {
          if (!frozenPrimed) {
            // debug: show one burst in a frozen frame
            frozenPrimed = true;
            if (CONFIG.fireworks && OPT.freeze > T_MESSAGE + 3) {
              for (let k = 0; k < 75; k++) stepFireworks(0.02, true);
            }
          }
          render(OPT.freeze, OPT.freeze, 0);
          return;
        }
        let t = (now - buildStart) / 1000;
        if (OPT.loop > 0 && t > OPT.loop) {
          buildStart = now;
          t = 0;
        }
        // Fireworks wait until the tree has finished lighting up.
        stepFireworks(dt, CONFIG.fireworks && t > T_MESSAGE + 3);
        render(t, (now - spinStart) / 1000, dt);
      }

      // ---------------------------------------------------------------- code panel
      // Types out the scene-building part of this very file, like a live editor.
      const codePanel = document.getElementById("codePanel");
      const codeLinesEl = document.getElementById("codeLines");
      const codeBtn = document.getElementById("codeBtn");
      const CODE_SPEED = 110; // characters per second
      const CODE_KEEP = 70; // finished lines kept in the DOM
      const codeState = {
        open: false,
        lines: [],
        first: 1,
        line: 0,
        col: 0,
        budget: 0,
        pause: 0,
        el: null,
      };
      {
        const from = SOURCE.indexOf("// Evenly distributed");
        const to = SOURCE.indexOf(
          "// ---------------------------------------------------------------- renderer",
        );
        codeState.first = SOURCE.slice(0, from).split("\n").length;
        codeState.lines = SOURCE.slice(from, to)
          .replace(/\s+$/, "")
          .split("\n");
      }

      const TOKEN_RE =
        /(\/\/.*$)|('(?:[^'\\]|\\.)*'?|"(?:[^"\\]|\\.)*"?|`[^`]*`?)|(\b\d+\.?\d*(?:e-?\d+)?\b)|\b(const|let|var|function|return|for|if|else|while|do|of|in|new|continue|break)\b|([A-Za-z_$][\w$]*)(?=\s*\()/g;
      const TOKEN_CLASS = [null, "tk-c", "tk-s", "tk-n", "tk-k", "tk-f"];
      const escapeHtml = (text) =>
        text.replace(
          /[&<>]/g,
          (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[ch],
        );
      function highlight(text) {
        let out = "",
          last = 0;
        TOKEN_RE.lastIndex = 0;
        for (let m; (m = TOKEN_RE.exec(text)) !== null; ) {
          if (m[0] === "") {
            TOKEN_RE.lastIndex++;
            continue;
          }
          let group = 1;
          while (m[group] === undefined) group++;
          out += escapeHtml(text.slice(last, m.index));
          out += `<span class="${TOKEN_CLASS[group]}">${escapeHtml(m[0])}</span>`;
          last = m.index + m[0].length;
        }
        return out + escapeHtml(text.slice(last));
      }

      function codeLineHtml(index, upTo, caret) {
        const text = codeState.lines[index].slice(0, upTo);
        return (
          `<span class="no">${codeState.first + index}</span><span>${highlight(text)}` +
          `${caret ? '<span class="caret"></span>' : ""}</span>`
        );
      }

      function codeStartLine() {
        const el = document.createElement("div");
        el.className = "ln cur";
        codeLinesEl.appendChild(el);
        while (codeLinesEl.children.length > CODE_KEEP)
          codeLinesEl.firstChild.remove();
        codeState.el = el;
        codeState.col = codeState.lines[codeState.line].search(/\S|$/); // indentation is instant
      }

      function codeReset() {
        codeLinesEl.textContent = "";
        codeState.line = 0;
        codeState.budget = 0;
        codeStartLine();
      }

      function codeTick(dt) {
        const st = codeState;
        if (!st.open) return;
        if (st.pause > 0) {
          st.pause -= dt;
          if (st.pause <= 0) codeReset();
          return;
        }
        st.budget += dt * CODE_SPEED;
        while (st.budget >= 1) {
          if (st.col < st.lines[st.line].length) {
            st.col++;
            st.budget -= 1;
            continue;
          }
          st.el.className = "ln"; // line finished: freeze it, move on
          st.el.innerHTML = codeLineHtml(st.line, st.col, false);
          st.budget -= 3;
          if (++st.line >= st.lines.length) {
            // end of the excerpt: hold, then replay
            st.line = st.lines.length - 1;
            st.pause = 4;
            return;
          }
          codeStartLine();
        }
        st.el.innerHTML = codeLineHtml(st.line, st.col, true);
      }

      function setCodeOpen(open) {
        codeState.open = open;
        document.body.classList.toggle("code", open);
        codePanel.setAttribute("aria-hidden", String(!open));
        if (open && !codeState.el) codeReset();
        resize();
      }
      codeBtn.addEventListener("click", () => {
        setCodeOpen(!codeState.open);
        codeBtn.blur();
      });

      // ---------------------------------------------------------------- page glue
      let resizeTimer = 0;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 80);
      });

      function toggleFullscreen() {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => {});
      }
      window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if (key === "h") OPT.hud = !OPT.hud;
        else if (key === "c") setCodeOpen(!codeState.open);
        else if (key === "f") toggleFullscreen();
        else if (key === "r") buildStart = performance.now();
      });
      canvas.addEventListener("dblclick", toggleFullscreen);

      // Hide the cursor when the mouse is idle.
      let idleTimer = 0;
      const wake = () => {
        document.body.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500);
      };
      window.addEventListener("mousemove", wake);
      wake();

      // Keep the display awake while the page is visible (where supported).
      async function keepAwake() {
        try {
          if (
            "wakeLock" in navigator &&
            document.visibilityState === "visible"
          ) {
            await navigator.wakeLock.request("screen");
          }
        } catch (err) {
          /* not available or denied: nothing to do */
        }
      }
      document.addEventListener("visibilitychange", keepAwake);
      keepAwake();

      resize();
      if (query.get("code") === "1") setCodeOpen(true);
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
